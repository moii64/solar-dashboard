services:
  - type: web
    name: solarvn-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solarvn-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: solarvn-redis
          property: connectionString
      - key: ENABLE_MQTT_CONSUMER
        value: "0"
      - key: ENABLE_BACKGROUND_TELEMETRY
        value: "0"

  - type: redis
    name: solarvn-redis
    ipAllowList: []
    plan: free

databases:
  - name: solarvn-postgres
    plan: free
