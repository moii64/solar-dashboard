services:
  - type: web
    name: solar-dashboard-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/solar.db
      - key: ENABLE_MQTT_CONSUMER
        value: "0"
      - key: ENABLE_BACKGROUND_TELEMETRY
        value: "1"
      - key: TELEMETRY_INTERVAL_SECONDS
        value: "5"
      - key: PORT
        generateValue: true
    healthCheckPath: /healthz
