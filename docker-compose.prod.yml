services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: solar_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: solar_db
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.prod.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto_passwd:/mosquitto/config/mosquitto_passwd
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql+psycopg://solar_user:${POSTGRES_PASSWORD}@db:5432/solar_db
      REDIS_URL: redis://redis:6379
      MQTT_BROKER: mqtt
    depends_on:
      - db
      - redis
      - mqtt
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  db_data:
  mqtt_data:
  mqtt_log:
